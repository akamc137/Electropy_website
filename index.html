<style>
/* ============================================================
   ELECTROPY — pure CSS + vanilla JS
   ============================================================ */

:root {
  --paper: #eee9df;
  --ink: #0b1b2a;
  --ink-2: #102332;
  --accent: #91b9c2;
  --accent-2: #cfe2e3;
  --tg: #2AABEE;
  --tg-hover: #3DBDF5;
  --tg-dark: #1E96D6;
  --ease-out: cubic-bezier(.22, 1, .36, 1);
  --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--paper);
  font-family: 'Segoe UI', Tahoma, sans-serif;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
body.menu-open { overflow: hidden; }

@media (hover: hover) and (pointer: fine) {
  body, body * { cursor: none !important; }
}

.page-wrapper { width: 100%; }
.page-desktop { display: block; }
.page-mobile  { display: none; }
.page-desktop > svg, .page-mobile > svg {
  display: block; width: 100%; height: auto; overflow: visible;
  user-select: none; -webkit-user-select: none;
}

/* ================= LOADING SCREEN ================= */
.loader {
  position: fixed; inset: 0; z-index: 99999;
  background: #0a1d2b;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 26px;
  transition: opacity .9s ease, visibility .9s ease;
}
.loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.loader-resistor { width: 120px; height: 60px; }
.loader-resistor svg { width: 100%; height: 100%; }
.loader-bar {
  width: 220px; height: 2px;
  background: rgba(145,185,194,.18);
  border-radius: 2px; overflow: hidden; position: relative;
}
.loader-bar::after {
  content: ''; position: absolute; inset: 0; width: 0;
  background: linear-gradient(90deg, #91b9c2, #cfe2e3);
  animation: loadFill 1.7s cubic-bezier(.65,0,.35,1) forwards;
  box-shadow: 0 0 12px rgba(145,185,194,.7);
}
@keyframes loadFill { to { width: 100%; } }
.loader-text {
  color: #91b9c2; font-size: 11px; letter-spacing: .35em;
  font-weight: 600;
  animation: pulseText 1.6s ease-in-out infinite;
}
@keyframes pulseText { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
.ldr-body {
  stroke-dasharray: 400; stroke-dashoffset: 400;
  animation: drawLine 1.4s ease .2s forwards;
}
@keyframes drawLine { to { stroke-dashoffset: 0; } }
.ldr-band { opacity: 0; animation: bandIn .3s ease forwards; }
.ldr-band:nth-child(2) { animation-delay: .9s; }
.ldr-band:nth-child(3) { animation-delay: 1.0s; }
.ldr-band:nth-child(4) { animation-delay: 1.1s; }
.ldr-band:nth-child(5) { animation-delay: 1.2s; }
@keyframes bandIn { to { opacity: 1; } }
.ldr-glow {
  fill: none; stroke: #91b9c2; stroke-width: 1; opacity: 0;
  animation: glowPulse 1.8s ease-in-out .6s infinite;
}
@keyframes glowPulse { 0%,100% { opacity: 0; } 50% { opacity: .5; } }

/* ================= SCROLL PROGRESS ================= */
.scroll-progress {
  position: fixed; top: 0; left: 0;
  height: 2px; width: 0%;
  background: linear-gradient(90deg, #91b9c2, #17303e);
  z-index: 9999;
  transition: width .15s linear;
}

/* ================= STICKY HEADER ================= */
.sticky-header {
  position: fixed; top: -100px; left: 0; right: 0;
  height: 78px; z-index: 9998;
  pointer-events: none;
  background: rgba(238, 233, 223, 0.62);
  backdrop-filter: blur(22px) saturate(180%);
  -webkit-backdrop-filter: blur(22px) saturate(180%);
  border-bottom: 1px solid rgba(23,48,62,.08);
  box-shadow: 0 4px 24px rgba(16,43,58,.05);
  transition: top .45s var(--ease-out), opacity .45s ease;
  display: flex; align-items: center;
  padding: 0 clamp(20px, 4vw, 72px);
  opacity: 0;
}
.sticky-header.visible { top: 0; pointer-events: auto; opacity: 1; }
.sticky-inner {
  width: 100%; max-width: 1440px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
}
.sticky-brand {
  display: flex; align-items: center; gap: 12px;
  color: #102332; font-weight: 700; font-size: 22px; letter-spacing: -.02em;
  transition: transform .35s var(--ease-spring);
  background: none; border: none; padding: 0;
}
.sticky-brand:hover { transform: scale(1.03); }
.sticky-brand-icon {
  width: 42px; height: 42px; border-radius: 5px;
  background: var(--ink);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: transform .4s var(--ease-spring), box-shadow .4s ease;
}
.sticky-brand:hover .sticky-brand-icon {
  transform: rotate(-6deg) scale(1.06);
  box-shadow: 0 6px 18px rgba(11,27,42,.30);
}
.sticky-brand-icon svg { width: 100%; height: 100%; display: block; }
.sticky-nav {
  display: flex; align-items: center;
  gap: clamp(20px, 3vw, 40px);
  font-size: 14px; color: #33464f;
}
.sticky-nav button {
  background: none; border: none; font: inherit; color: inherit;
  padding: 4px 0;
  transition: color .35s ease, transform .35s var(--ease-spring);
  position: relative;
}
.sticky-nav button:hover { color: #79a7b2; transform: translateY(-1px); }
.sticky-nav button::after {
  content: ''; position: absolute; left: 0; bottom: -4px;
  width: 0; height: 1px; background: #91b9c2;
  transition: width .4s var(--ease-out);
}
.sticky-nav button:hover::after { width: 100%; }

/* گروه دکمه‌های اکشن هدر */
.sticky-actions {
  display: flex; align-items: center; gap: 10px;
  flex-shrink: 0;
}

/* دکمه گیت‌هاب هدر */
.sticky-cta {
  background: var(--ink); color: #e8e4dc;
  font-size: 13px; font-weight: 600; font-family: inherit;
  padding: 0 20px; height: 44px;
  border-radius: 5px; border: none;
  transition: transform .35s var(--ease-spring), filter .4s ease, box-shadow .4s ease;
  display: inline-flex; align-items: center; justify-content: center;
  gap: 7px; line-height: 1;
  white-space: nowrap;
}
.sticky-cta span { display: inline-flex; align-items: center; }
.sticky-cta svg { display: block; transition: transform .35s var(--ease-spring); flex-shrink: 0; }
.sticky-cta:hover {
  transform: translateY(-2px) scale(1.04);
  filter: brightness(1.15);
  box-shadow: 0 8px 22px rgba(145,185,194,.45);
}
.sticky-cta:hover svg { transform: translate(1px, -1px); }
.sticky-cta:active { transform: scale(.96); }

/* دکمه تلگرام هدر — آیکونی، جمع‌وجور */
.sticky-tg-icon {
  width: 44px; height: 44px;
  border-radius: 5px; border: none;
  background: linear-gradient(135deg, var(--tg) 0%, var(--tg-dark) 100%);
  color: #fff;
  display: inline-flex; align-items: center; justify-content: center;
  padding: 0; flex-shrink: 0;
  box-shadow: 0 2px 10px rgba(42,171,238,.28);
  transition: transform .35s var(--ease-spring), box-shadow .4s ease, filter .4s ease;
}
.sticky-tg-icon svg { display: block; position: relative; z-index: 1; }
.sticky-tg-icon:hover {
  transform: translateY(-2px) scale(1.06);
  filter: brightness(1.08);
  box-shadow: 0 8px 22px rgba(42,171,238,.5), 0 0 0 2px rgba(145,185,194,.35);
}
.sticky-tg-icon:active { transform: scale(.95); }

/* ================= HAMBURGER ================= */
.hamburger {
  display: none;
  width: 42px; height: 42px; border-radius: 8px;
  background: var(--ink); border: none;
  position: relative; z-index: 10001;
  align-items: center; justify-content: center; flex-direction: column; gap: 5px;
  transition: transform .35s var(--ease-spring), background .3s ease;
  padding: 0; flex-shrink: 0;
}
.hamburger:hover { background: #17303e; transform: scale(1.06); }
.hamburger:active { transform: scale(.93); }
.hamburger span {
  display: block; width: 19px; height: 2px;
  background: var(--accent-2); border-radius: 2px;
  transition: transform .38s var(--ease-out), opacity .25s ease;
  transform-origin: center;
}
.hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.hamburger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
.hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

/* ================= MOBILE MENU ================= */
.mobile-menu {
  display: none;
  position: fixed; top: 68px; left: 12px; right: 12px;
  z-index: 10000;
  background: rgba(10, 29, 43, 0.97);
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  border-radius: 12px;
  border: 1px solid rgba(145,185,194,.28);
  box-shadow: 0 18px 40px rgba(0,0,0,.35);
  flex-direction: column; padding: 10px; gap: 2px;
  opacity: 0; visibility: hidden;
  transform: translateY(-14px) scale(.985);
  transform-origin: top center;
  transition: opacity .32s ease, visibility .32s ease, transform .4s var(--ease-out);
}
.mobile-menu.open { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }
.mobile-menu-header {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 6px 12px; margin-bottom: 4px;
  border-bottom: 1px solid rgba(145,185,194,.18);
}
.mobile-menu-logo {
  width: 42px; height: 42px; border-radius: 5px;
  background: var(--ink);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; overflow: hidden;
}
.mobile-menu-logo svg { width: 100%; height: 100%; display: block; }
.mobile-menu-brand-text { display: flex; flex-direction: column; line-height: 1.1; }
.mobile-menu-brand-name {
  color: var(--accent-2); font-size: 17px; font-weight: 700; letter-spacing: -.01em;
}
.mobile-menu-brand-sub {
  color: #65747b; font-size: 8px; letter-spacing: .22em;
  font-weight: 600; margin-top: 3px;
}
.mobile-menu-header, .mobile-menu a {
  opacity: 0; transform: translateY(-9px);
  transition:
    opacity .3s ease calc(var(--i, 0) * 45ms),
    transform .45s var(--ease-out) calc(var(--i, 0) * 45ms),
    background .25s ease, color .25s ease, border-color .25s ease;
}
.mobile-menu.open .mobile-menu-header,
.mobile-menu.open a { opacity: 1; transform: translateY(0); }
.mobile-menu a {
  color: var(--accent-2); font-size: 15px; font-weight: 600;
  letter-spacing: .04em; text-decoration: none;
  padding: 12px 16px; border-radius: 8px;
  border: 1px solid transparent;
  display: flex; align-items: center; justify-content: space-between;
}
.mobile-menu a .m-chev {
  color: rgba(145,185,194,.55);
  transition: transform .25s ease, color .25s ease;
}
.mobile-menu a:hover, .mobile-menu a:active {
  background: rgba(145,185,194,.12);
  color: #91b9c2;
  border-color: rgba(145,185,194,.3);
}
.mobile-menu a:hover .m-chev, .mobile-menu a:active .m-chev {
  transform: translateX(4px); color: #91b9c2;
}

/* دکمه گیت‌هاب منوی موبایل */
.mobile-menu .mobile-gh-btn {
  margin-top: 6px;
  background: #91b9c2; color: #0a1d2b !important;
  font-weight: 700; padding: 13px 20px !important;
  border-radius: 8px; border: none !important;
  justify-content: center; gap: 8px;
}
.mobile-menu .mobile-gh-btn:hover { background: var(--accent-2); color: #0a1d2b !important; }

/* دکمه تلگرام منوی موبایل */
.mobile-menu .mobile-tg-btn {
  margin-top: 6px;
  background: linear-gradient(135deg, var(--tg) 0%, var(--tg-dark) 100%);
  color: #fff !important;
  font-weight: 700; padding: 13px 20px !important;
  border-radius: 8px; border: none !important;
  justify-content: center; gap: 8px;
  box-shadow: 0 4px 14px rgba(42,171,238,.3);
}
.mobile-menu .mobile-tg-btn:hover {
  background: linear-gradient(135deg, var(--tg-hover) 0%, var(--tg) 100%);
  color: #fff !important;
}

.mobile-backdrop {
  display: none;
  position: fixed; inset: 0; z-index: 9999;
  background: rgba(10, 29, 43, 0.35);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  opacity: 0; visibility: hidden;
  transition: opacity .3s ease, visibility .3s ease;
}
.mobile-backdrop.open { opacity: 1; visibility: visible; }

/* ================= TOAST ================= */
.toast {
  position: fixed; bottom: 30px; left: 50%;
  transform: translate(-50%) translateY(100px);
  background: rgba(16,43,58,.95);
  color: #e8e4dc;
  font-size: 13px; font-weight: 500; letter-spacing: .05em;
  padding: 12px 20px; border-radius: 6px;
  box-shadow: 0 8px 24px rgba(0,0,0,.28);
  z-index: 99996;
  opacity: 0;
  transition: transform .45s var(--ease-out), opacity .45s ease;
  border: 1px solid rgba(145,185,194,.35);
  max-width: 90vw; text-align: center;
  display: inline-flex; align-items: center; gap: 9px;
  pointer-events: none;
}
.toast.show { transform: translate(-50%) translateY(0); opacity: 1; }
.toast svg { color: #91b9c2; flex-shrink: 0; }

/* ================= SVG BUTTONS & CARDS ================= */
.btn-g, .feature-card, .arch-block, .proj-panel {
  transform-box: fill-box; transform-origin: center;
  will-change: transform, filter;
}
.btn-g { transition: transform .4s var(--ease-spring), filter .45s ease; }
.btn-g:hover { transform: scale(1.05); filter: brightness(1.07) drop-shadow(0 6px 18px rgba(145,185,194,.45)); }
.btn-g:active { transform: scale(.97); filter: brightness(.94); }
.btn-outline-g {
  transform-box: fill-box; transform-origin: center;
  transition: transform .4s var(--ease-spring), filter .45s ease;
}
.btn-outline-g .btn-outline { transition: fill .4s ease; }
.btn-outline-g:hover { transform: scale(1.04); filter: drop-shadow(0 4px 12px rgba(145,185,194,.3)); }
.btn-outline-g:hover .btn-outline { fill: rgba(182,215,220,.12); }
.btn-outline-g:active { transform: scale(.97); }
.nav-link {
  transform-box: fill-box; transform-origin: center;
  transition: fill .4s ease, transform .35s var(--ease-spring);
}
.nav-link:hover { fill: #9fd3dd !important; }
.footer-link { transition: fill .4s ease; }
.footer-link:hover { fill: #91b9c2 !important; }
.tg-footer-link { cursor: pointer; }
.tg-footer-link:hover { fill: var(--tg) !important; }
.feature-card { transition: transform .5s var(--ease-out), filter .5s ease; }
.feature-card:hover { transform: translateY(-9px) scale(1.012); filter: drop-shadow(0 16px 30px rgba(16,43,58,.2)); }
.feature-card:active { transform: translateY(-2px) scale(.995); }
.arch-block, .proj-panel { transition: transform .5s var(--ease-out), filter .5s ease; }
.arch-block:hover, .proj-panel:hover { transform: translateY(-6px) scale(1.01); filter: drop-shadow(0 10px 22px rgba(16,43,58,.22)); }
.arch-block:active, .proj-panel:active { transform: translateY(-1px) scale(.997); }
.deco-cross { transform-box: fill-box; transform-origin: center; transition: transform .55s var(--ease-out); }
.feature-card:hover .deco-cross { transform: rotate(90deg); }
.deco-dot { transform-box: fill-box; transform-origin: center; }
.feature-card:hover .deco-dot { animation: dotPop .7s var(--ease-spring); }
@keyframes dotPop { 0% { transform: scale(1); } 45% { transform: scale(1.45); } to { transform: scale(1); } }
.deco-lang { transform-box: fill-box; transform-origin: center; transition: transform .45s var(--ease-spring); }
.feature-card:hover .deco-lang { transform: scale(1.12); }
.dl-pulse { transform-box: fill-box; transform-origin: center; }
.dl-pulse.pulse { animation: dlPulse 1.5s var(--ease-out); }
@keyframes dlPulse {
  0% { filter: none; transform: scale(1); }
  25% { filter: drop-shadow(0 0 26px rgba(145,185,194,.95)); transform: scale(1.06); }
  55% { filter: drop-shadow(0 0 14px rgba(145,185,194,.6)); transform: scale(.99); }
  to { filter: none; transform: scale(1); }
}
.launcher-line { stroke-dasharray: 8 6; animation: dashMove 3s linear infinite; }
@keyframes dashMove { to { stroke-dashoffset: -56; } }
.dl-card-glow { animation: softPulse 5s ease-in-out infinite; }
@keyframes softPulse { 0%,100% { opacity: .85; } 50% { opacity: 1; } }

/* ============================================================
   HERO ENTRANCE
   ============================================================ */
@keyframes heroIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}
.hero-el {
  opacity: 0;
  animation-name: heroIn, heroForce;
  animation-duration: .9s, .01s;
  animation-timing-function: cubic-bezier(.22,1,.36,1), linear;
  animation-fill-mode: forwards, forwards;
  animation-delay: var(--hd, 0ms), 2s;
}
@keyframes heroForce { to { opacity: 1; } }

/* ================= SCROLL REVEAL ================= */
.reveal {
  opacity: 0; transform: translateY(38px); filter: blur(6px);
  transition: opacity 1s ease, transform 1.05s var(--ease-out), filter .9s ease;
  transition-delay: var(--rd, 0ms);
  will-change: opacity, transform, filter;
}
.reveal.in { opacity: 1; transform: translateY(0); filter: blur(0); }
.sweep-line {
  transform-box: fill-box; transform-origin: left center;
  transform: scaleX(0);
  transition: transform 1.25s var(--ease-out) .3s;
}
.reveal.in .sweep-line { transform: scaleX(1); }
.float-rect {
  transform-box: fill-box; transform-origin: center;
  animation: floatSq 9s ease-in-out infinite;
}
.float-rect:nth-child(2) { animation-duration: 7.5s;  animation-delay: -1.6s; }
.float-rect:nth-child(3) { animation-duration: 10.5s; animation-delay: -3.1s; }
.float-rect:nth-child(4) { animation-duration: 8.2s;  animation-delay: -2.2s; }
.float-rect:nth-child(5) { animation-duration: 11s;   animation-delay: -4.4s; }
.float-rect:nth-child(6) { animation-duration: 7s;    animation-delay: -0.8s; }
@keyframes floatSq {
  0%,100% { transform: translate(0) rotate(0); }
  33%     { transform: translate(5px, -13px) rotate(5deg); }
  66%     { transform: translate(-4px, -5px) rotate(-4deg); }
}

/* ================= CLICK RIPPLE ================= */
.click-ripple {
  position: fixed;
  width: 12px; height: 12px;
  border-radius: 50%;
  border: 1.5px solid #91b9c2;
  pointer-events: none;
  z-index: 9998;
  transform: translate(-50%, -50%) scale(1);
  opacity: .9;
  animation: clickRipple .8s ease-out forwards;
}
.click-ripple.touch {
  width: 20px; height: 20px;
  background: rgba(145,185,194,.18);
  border-width: 1px;
}
@keyframes clickRipple { to { transform: translate(-50%, -50%) scale(6); opacity: 0; } }

/* ================= RESISTOR CURSOR ================= */
.resistor-shadow {
  position: fixed; left: 0; top: 0;
  width: 32px; height: 11px; border-radius: 999px;
  transform-origin: center center;
  z-index: 99997; pointer-events: none;
  background: radial-gradient(ellipse, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.25) 45%, rgba(0,0,0,0) 75%);
  filter: blur(3px);
  opacity: 0; transition: opacity .5s ease;
  will-change: transform;
}
.resistor-body {
  position: fixed; left: 0; top: 0;
  width: 38px; height: 15px; border-radius: 999px;
  transform-origin: center center;
  z-index: 99998; pointer-events: none;
  background:
    linear-gradient(90deg,
      transparent 0%, transparent 10%,
      rgba(139,69,19,0.95) 10%, rgba(139,69,19,0.95) 19%,
      transparent 19%, transparent 35%,
      rgba(20,20,20,0.95) 35%, rgba(20,20,20,0.95) 44%,
      transparent 44%, transparent 60%,
      rgba(200,30,30,0.95) 60%, rgba(200,30,30,0.95) 69%,
      transparent 69%, transparent 81%,
      rgba(212,175,55,0.95) 81%, rgba(212,175,55,0.95) 90%,
      transparent 90%, transparent 100%),
    linear-gradient(180deg, rgba(255,255,255,0.22), rgba(255,255,255,0.03) 45%, rgba(0,0,0,0.12) 100%),
    rgba(255,255,255,0.10);
  border: 1.5px solid rgba(255,255,255,0.45);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.5),
    inset 0 -2px 6px rgba(0,0,0,0.25),
    0 0 14px rgba(145,185,194,0.35),
    0 6px 20px rgba(0,0,0,0.18);
  backdrop-filter: blur(10px) saturate(160%);

<script>
(function() {
  'use strict';

  /* ============================================================
     🔗 LINKS
     ============================================================ */
  var GITHUB_URL = "https://github.com/PAforge-dev-team/Electropy";
  var DOWNLOAD_URL = "https://github.com/PAforge-dev-team/Electropy/releases/download/Electropy/Electropy_V1.0.0+2Exts.zip";
  var TELEGRAM_URL = "https://t.me/PAforge";

  /* ---------- TEXT INJECTION (from texts.js) ---------- */
  if (window.TEXTS) {
    document.querySelectorAll('[data-text]').forEach(function(el) {
      var key = el.getAttribute('data-text');
      if (window.TEXTS[key] !== undefined) {
        el.textContent = window.TEXTS[key];
      } else {
        console.warn('[texts.js] Missing key:', key);
      }
    });
  }

  var isTouchDevice =
    window.matchMedia('(hover: none)').matches ||
    window.matchMedia('(pointer: coarse)').matches ||
    ('ontouchstart' in window && navigator.maxTouchPoints > 0);
  var hoverFine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

  /* ---------- LOADER ---------- */
  var loader = document.getElementById('loader');
  function hideLoader() {
    if (!loader.classList.contains('hidden')) {
      loader.classList.add('hidden');
      document.body.classList.add('loaded');
    }
  }
  if (document.readyState === 'complete') {
    setTimeout(hideLoader, 600);
  } else {
    window.addEventListener('load', function() {
      setTimeout(hideLoader, 600);
    });
  }
  setTimeout(hideLoader, 2200);

  /* ---------- TOAST ---------- */
  var toast = document.getElementById('toast');
  var toastMessage = document.getElementById('toastMessage');
  var toastTimer = null;
  function showToast(msg) {
    toastMessage.textContent = msg;
    toast.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function() {
      toast.classList.remove('show');
    }, 2600);
  }

  /* ---------- MENU ---------- */
  var hamburger = document.getElementById('hamburger');
  var mobileMenu = document.getElementById('mobileMenu');
  var mobileBackdrop = document.getElementById('mobileBackdrop');
  var menuOpen = false;

  function toggleMenu() {
    menuOpen = !menuOpen;
    hamburger.classList.toggle('open', menuOpen);
    mobileMenu.classList.toggle('open', menuOpen);
    mobileBackdrop.classList.toggle('open', menuOpen);
    mobileMenu.setAttribute('aria-hidden', !menuOpen);
    document.body.classList.toggle('menu-open', menuOpen);
  }
  function closeMenu() {
    if (!menuOpen) return;
    menuOpen = false;
    hamburger.classList.remove('open');
    mobileMenu.classList.remove('open');
    mobileBackdrop.classList.remove('open');
    mobileMenu.setAttribute('aria-hidden', true);
    document.body.classList.remove('menu-open');
  }
  hamburger.addEventListener('click', function(e) {
    e.stopPropagation();
    toggleMenu();
  });
  mobileBackdrop.addEventListener('click', closeMenu);

  /* ---------- NAVIGATION ---------- */
  function navigateTo(section) {
    closeMenu();
    if (section === 'home') {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    var targets = document.querySelectorAll('[data-section-target="' + section + '"]');
    var top = 0;
    var found = false;
    targets.forEach(function(el) {
      if (found) return;
      var rect = el.getBoundingClientRect();
      if (rect.width > 0 || rect.height > 0) {
        found = true;
        top = rect.top + window.scrollY;
      }
    });
    if (!found) {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    var offset = window.innerWidth <= 880 ? 74 : 88;
    window.scrollTo({ top: Math.max(0, top - offset), behavior: 'smooth' });
  }

  /* ---------- ACTIONS ---------- */
  function handleScrollToDownload() {
    navigateTo('download');
    setTimeout(function() {
      var els = document.querySelectorAll('.dl-pulse');
      els.forEach(function(el) { el.classList.add('pulse'); });
      setTimeout(function() {
        els.forEach(function(el) { el.classList.remove('pulse'); });
      }, 1700);
    }, 600);
  }

  function handleActualDownload() {
    var els = document.querySelectorAll('.dl-pulse');
    els.forEach(function(el) { el.classList.add('pulse'); });
    setTimeout(function() {
      els.forEach(function(el) { el.classList.remove('pulse'); });
    }, 1700);
    showToast(window.TEXTS ? window.TEXTS.toast_downloading : 'Starting download...');
    window.location.href = DOWNLOAD_URL;
  }

  function handleVisitGithub() {
    showToast(window.TEXTS ? window.TEXTS.toast_visit_github : 'Opening GitHub repository...');
    window.open(GITHUB_URL, '_blank', 'noopener');
  }

  function handleTelegram() {
    showToast(window.TEXTS ? window.TEXTS.toast_telegram : 'Opening Telegram channel...');
    window.open(TELEGRAM_URL, '_blank', 'noopener');
  }

  function handleLang() {
    showToast(window.TEXTS ? window.TEXTS.toast_lang : 'Persian UI is available inside the app.');
  }

  /* ---------- EVENT DELEGATION ---------- */
  document.addEventListener('click', function(e) {
    var navEl = e.target.closest ? e.target.closest('[data-nav]') : null;
    if (navEl) {
      e.preventDefault();
      navigateTo(navEl.getAttribute('data-nav'));
      return;
    }
    var actionEl = e.target.closest ? e.target.closest('[data-action]') : null;
    if (actionEl) {
      e.preventDefault();
      var action = actionEl.getAttribute('data-action');
      if (action === 'download') { handleActualDownload(); }
      if (action === 'scroll-download') { handleScrollToDownload(); }
      if (action === 'github') { handleVisitGithub(); }
      if (action === 'telegram') { handleTelegram(); }
      if (action === 'lang') { handleLang(); }
      if (action === 'explore') { navigateTo('features'); }
    }
  });

  /* ---------- HEADER / SCROLL PROGRESS ---------- */
  var stickyHeader = document.getElementById('stickyHeader');
  var scrollProgress = document.getElementById('scrollProgress');
  var ticking = false;

  function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function() {
      var isMobile = window.innerWidth <= 880 || isTouchDevice;
      stickyHeader.classList.toggle('visible', isMobile || window.scrollY > 400);
      var docHeight = document.documentElement.scrollHeight - window.innerHeight;
      var pct = docHeight > 0 ? (window.scrollY / docHeight) * 100 : 0;
      scrollProgress.style.width = pct + '%';
      ticking = false;
    });
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  onScroll();

  /* ---------- REVEAL ---------- */
  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('in');
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });

  document.querySelectorAll('.reveal').forEach(function(el) {
    observer.observe(el);
  });

  /* ============================================================
     RESISTOR CURSOR
     ============================================================ */
  if (!isTouchDevice) {
    var canvas = document.getElementById('resistorStage');
    var ctx = canvas.getContext('2d');
    var resistorEl = document.getElementById('resistorBody');
    var shadowEl = document.getElementById('resistorShadow');

    var W, H;
    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    var mouse = { x: W / 2, y: H / 2 };
    function setMouse(x, y) { mouse.x = x; mouse.y = y; }

    var IDLE_TIMEOUT = 3000;
    var idleTimer = null;
    var cursorVisible = false;

    function showCursor() {
      if (!cursorVisible) {
        cursorVisible = true;
        canvas.classList.add('active');
        resistorEl.classList.add('active');
        shadowEl.classList.add('active');
      }
      if (idleTimer) clearTimeout(idleTimer);
      idleTimer = setTimeout(hideCursor, IDLE_TIMEOUT);
    }
    function hideCursor() {
      cursorVisible = false;
      canvas.classList.remove('active');
      resistorEl.classList.remove('active');
      shadowEl.classList.remove('active');
    }

    window.addEventListener('mousemove', function(e) {
      setMouse(e.clientX, e.clientY);
      showCursor();
    });
    window.addEventListener('mousedown', showCursor);
    window.addEventListener('click', showCursor);
    window.addEventListener('scroll', showCursor, { passive: true });
    window.addEventListener('wheel', showCursor, { passive: true });
    window.addEventListener('keydown', showCursor);

    var body = { x: W / 2, y: H / 2, heading: 0 };
    var distanceTraveled = 0;

    var CAPSULE_HALF_LEN = 18;
    var CAPSULE_RADIUS = 7.5;
    var LEG_UPPER = 11;
    var LEG_LOWER = 12;
    var ALONG_OFFSETS = [15, -1, -17];
    var BASE_SIDE = CAPSULE_RADIUS * 0.95;
    var STEP_FORWARD = 6.5;
    var OUTWARD = 9;
    var STEP_FREQ = 1 / 52;
    var IDLE_CREEP = 0.10;

    var legs = [];
    ALONG_OFFSETS.forEach(function(along, segIndex) {
      [-1, 1].forEach(function(side) {
        var sideIndex = side === 1 ? 0 : 1;
        var group = (segIndex + sideIndex) % 2;
        legs.push({
          along: along, side: side,
          phaseOffset: group * 0.5,
          state: 'stance',
          footX: null, footY: null,
          swingFromX: 0, swingFromY: 0, swingToX: 0, swingToY: 0
        });
      });
    });

    function twoBoneIK(bx, by, fx, fy, l1, l2, bendSign, bendScale) {
      var dx = fx - bx, dy = fy - by;
      var d = Math.hypot(dx, dy) || 0.0001;
      var maxReach = l1 + l2 - 0.5;
      if (d > maxReach) { dx = (dx / d) * maxReach; dy = (dy / d) * maxReach; d = maxReach; }
      var a = Math.min(l1, Math.max(-l2, (l1 * l1 - l2 * l2 + d * d) / (2 * d)));
      var h = Math.sqrt(Math.max(0, l1 * l1 - a * a)) * bendScale;
      var mx = bx + (dx / d) * a, my = by + (dy / d) * a;
      var px = -dy / d, py = dx / d;
      return { kx: mx + px * h * bendSign, ky: my + py * h * bendSign, fx: bx + dx, fy: by + dy };
    }

    function lerp(a, b, t) { return a + (b - a) * t; }
    function smoothstep(t) { return t * t * (3 - 2 * t); }

    var lastX = body.x, lastY = body.y;
    var resistorHalfW = resistorEl.offsetWidth / 2;
    var resistorHalfH = resistorEl.offsetHeight / 2;
    var shadowHalfW = shadowEl.offsetWidth / 2;
    var shadowHalfH = shadowEl.offsetHeight / 2;
    var SHADOW_DROP = 6;

    function animate() {
      var ease = 0.15;
      body.x += (mouse.x - body.x) * ease;
      body.y += (mouse.y - body.y) * ease;

      var dx = body.x - lastX, dy = body.y - lastY;
      var speed = Math.hypot(dx, dy);
      lastX = body.x; lastY = body.y;

      if (speed > 0.05) {
        var targetHeading = Math.atan2(dy, dx);
        var diff = targetHeading - body.heading;
        diff = Math.atan2(Math.sin(diff), Math.cos(diff));
        body.heading += diff * 0.16;
      }

      distanceTraveled += speed + IDLE_CREEP;

      var fx = Math.cos(body.heading), fy = Math.sin(body.heading);
      var nx = -fy, ny = fx;

      ctx.clearRect(0, 0, W, H);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      ctx.strokeStyle = 'rgba(210, 210, 215, 0.7)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(body.x - fx * (CAPSULE_HALF_LEN + 11), body.y - fy * (CAPSULE_HALF_LEN + 11));
      ctx.lineTo(body.x - fx * (CAPSULE_HALF_LEN - 3), body.y - fy * (CAPSULE_HALF_LEN - 3));
      ctx.moveTo(body.x + fx * (CAPSULE_HALF_LEN - 3), body.y + fy * (CAPSULE_HALF_LEN - 3));
      ctx.lineTo(body.x + fx * (CAPSULE_HALF_LEN + 11), body.y + fy * (CAPSULE_HALF_LEN + 11));
      ctx.stroke();

      legs.forEach(function(leg) {
        var baseX = body.x + fx * leg.along + nx * BASE_SIDE * leg.side;
        var baseY = body.y + fy * leg.along + ny * BASE_SIDE * leg.side;
        var landX = baseX + fx * STEP_FORWARD + nx * OUTWARD * leg.side;
        var landY = baseY + fy * STEP_FORWARD + ny * OUTWARD * leg.side;

        var t = (distanceTraveled * STEP_FREQ + leg.phaseOffset) % 1;
        var isSwing = t >= 0.5;

        if (leg.footX === null) { leg.footX = landX; leg.footY = landY; }

        if (isSwing && leg.state !== 'swing') {
          leg.state = 'swing';
          leg.swingFromX = leg.footX; leg.swingFromY = leg.footY;
        }
        if (!isSwing) leg.state = 'stance';

        if (leg.state === 'swing') {
          var p = smoothstep((t - 0.5) * 2);
          leg.swingToX = landX; leg.swingToY = landY;
          leg.footX = lerp(leg.swingFromX, leg.swingToX, p);
          leg.footY = lerp(leg.swingFromY, leg.swingToY, p);
        }

        var bendScale = leg.state === 'swing' ? 1.35 : 0.75;
        var bend = twoBoneIK(baseX, baseY, leg.footX, leg.footY, LEG_UPPER, LEG_LOWER, leg.side, bendScale);

        var alpha = leg.state === 'swing' ? 0.9 : 0.5;
        ctx.strokeStyle = 'rgba(130, 230, 200, ' + alpha + ')';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(baseX, baseY);
        ctx.lineTo(bend.kx, bend.ky);
        ctx.lineTo(bend.fx, bend.fy);
        ctx.stroke();

        if (leg.state === 'stance') {
          ctx.beginPath();
          ctx.arc(leg.footX, leg.footY, 1.8, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(130, 230, 200, 0.6)';
          ctx.fill();
        }
      });

      shadowEl.style.transform =
        'translate(' + (body.x - shadowHalfW) + 'px, ' + (body.y + SHADOW_DROP - shadowHalfH) + 'px) rotate(' + body.heading + 'rad)';
      resistorEl.style.transform =
        'translate(' + (body.x - resistorHalfW) + 'px, ' + (body.y - resistorHalfH) + 'px) rotate(' + body.heading + 'rad)';

      requestAnimationFrame(animate);
    }
    animate();
  }

  /* ---------- CLICK RIPPLE ---------- */
  function createRipple(x, y, touch) {
    var ripple = document.createElement('div');
    ripple.className = 'click-ripple' + (touch ? ' touch' : '');
    ripple.style.left = x + 'px';
    ripple.style.top = y + 'px';
    document.body.appendChild(ripple);
    setTimeout(function() { ripple.remove(); }, 900);
  }
  if (!isTouchDevice) {
    document.addEventListener('pointerdown', function(e) {
      createRipple(e.clientX, e.clientY, false);
    });
  }

  /* ---------- KEYBOARD ---------- */
  window.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      if (menuOpen) closeMenu();
      else window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  });

  /* ---------- BUTTONS ---------- */
  document.getElementById('brandBtn').addEventListener('click', function() {
    navigateTo('home');
  });
  document.getElementById('headerGithubBtn').addEventListener('click', handleVisitGithub);
  document.getElementById('mobileGithubBtn').addEventListener('click', handleVisitGithub);

  var headerTg = document.getElementById('headerTelegramBtn');
  if (headerTg) headerTg.addEventListener('click', handleTelegram);
  var mobileTg = document.getElementById('mobileTelegramBtn');
  if (mobileTg) mobileTg.addEventListener('click', function() {
    closeMenu();
  });
  var footerTgD = document.getElementById('footerTelegramBtn');
  if (footerTgD) footerTgD.addEventListener('click', handleTelegram);
  var footerTgM = document.getElementById('footerTelegramBtnM');
  if (footerTgM) footerTgM.addEventListener('click', handleTelegram);

  /* ---------- RESIZE (close menu) ---------- */
  window.addEventListener('resize', function() {
    if (window.innerWidth > 880) closeMenu();
  });

})();
</script>
